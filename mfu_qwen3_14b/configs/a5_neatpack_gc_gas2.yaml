### ========================================================================
### A5 · 打包 + 开梯度检查点 · GAS=2（严格同批量对照组）
### ------------------------------------------------------------------------
### 为什么有这一组：A/A2 名义 GBS=32 但那是「行数」，打包后每行平均装 4.72 条
###   真实样本，实际每步喂 150.9 条 —— 是 R3 等不打包组（32 条）的 4.72 倍。
###   所以 A2 的 38.38% 里混着「批量变大」的贡献，无法与 R3 公平对照。
### 本组把 GAS 从 8 降到 2 → 每步 8 行 × 4.72 = 37.7 条样本，落回 32 条附近
###   （1.18×，粒度受每行 4.72 条限制，取不到更准的值）。
### 预期：每步 token 少了 4 倍，固定开销占比上升，MFU 应低于 GAS=8 那版。
###   两组之差即「批量效应」，剩下的才是打包本身的贡献。
### ★ MBS 仍必须是 1（collator 硬断言），所以只能靠 GAS 调批量。
