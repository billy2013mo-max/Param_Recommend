### ========================================================================
### C · 8 卡 ZeRO-3 关梯度检查点，MBS=2
### ------------------------------------------------------------------------
### 这是唯一"能关 GC 还保住 MBS2"的组合：ZeRO-3 把参数也切成 8 份，
###   常驻底座降到约 32.6 GiB，腾出约 100 GiB 给激活值。
### 但 ZeRO-3 每层前向都要 all-gather 参数，通信很重 —— R0 vs R2 已经证明
###   ZeRO-3 是本任务最大的吞吐杀手。所以本组是一场对赌：
###   省下来的重算，能不能盖过 ZeRO-3 的通信开销。我预期盖不过。
### 注意：卡数变 8，MFU 分母也变 8，跟 4 卡组不能只比 MFU，要一起看真实 tok/s。
### GBS 固定 32（8卡 × 2 × 2）。
### ========================================================================

model_name_or_path: /wanqing-models/Qwen3-14B
trust_remote_code: true
flash_attn: fa3                  # ★ 显式指定 FA3；不写会落到 AUTO→FA2
enable_thinking: true
use_unsloth_gc: false           # 激活值不卸载 CPU

stage: sft
do_train: true
finetuning_type: full
enable_liger_kernel: false
disable_gradient_checkpointing: true    # ★ 关梯度检查点

dataset: baseline_2gpu
dataset_dir: /wanqing-develop/chengjin
template: qwen3
cutoff_len: 4096                 # ★ 8192 → 4096（用户下限）
max_samples: 100000
packing: false
preprocessing_num_workers: 4
dataloader_num_workers: 4

output_dir: /wanqing-develop/luowenjing/Param_Recommend/mfu_qwen3_14b/results/c_nogc_mbs2_z3_8gpu/save
logging_steps: 1
save_strategy: "no"
plot_loss: false
overwrite_output_dir: true
report_to: none
disable_tqdm: true

max_steps: 20
per_device_train_batch_size: 2   # GBS = 8卡 × 2 × 2 = 32
gradient_accumulation_steps: 2
learning_rate: 1.0e-6
lr_scheduler_type: cosine
lr_scheduler_kwargs: {"num_cycles": 0.5}
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
seed: 42
optim: adamw_torch_fused
ddp_timeout: 180000000
deepspeed: /wanqing-models/tangcan/llama-factory-local/llama-factory/examples/deepspeed/ds_z3_config.json
include_num_input_tokens_seen: true
resume_from_checkpoint: null

do_eval: false
eval_strategy: "no"              # 必须显式写；只写 do_eval:false 关不掉 eval
