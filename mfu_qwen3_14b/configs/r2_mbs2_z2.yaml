### ========================================================================
### R2 · 换 ZeRO 阶段：3 → 2，同时 MBS 1→2
### ------------------------------------------------------------------------
### ZeRO-3 会把模型参数也切开，每层前向都要 all-gather 一次参数；
###   ZeRO-2 只切优化器状态和梯度，参数每张卡都留整份 → 通信量少一个量级。
### 代价是显存：14B 全参 ZeRO-2 每卡要放整份 bf16 参数(约 28 GiB)。
###   2 卡放不下才必须用 ZeRO-3；4 卡是"多一张卡换一个更便宜的并行策略"。
### 吞吐模型预测这一步是最大的杠杆（同 MBS 下 1.8~2.0 倍）。
###
### 本轮前提：不开 CCE、不开 LoRA Fusion（由启动脚本 unset 环境变量实现，
###   不是 yaml 参数；写进 yaml 会让参数解析直接报错）。
### GBS 固定 32（4卡 × MBS × GAS），与其余各组严格一致。
### ========================================================================

model_name_or_path: /wanqing-models/Qwen3-14B
trust_remote_code: true
flash_attn: fa3                  # ★ 显式指定 FA3；不写会落到 AUTO→FA2
enable_thinking: true
use_unsloth_gc: false           # 激活值不卸载 CPU

stage: sft
do_train: true
finetuning_type: full
enable_liger_kernel: false
disable_gradient_checkpointing: false   # 开梯度检查点

dataset: baseline_2gpu
dataset_dir: /wanqing-develop/chengjin
template: qwen3
cutoff_len: 4096                 # ★ 8192 → 4096（用户下限）
max_samples: 100000
packing: false
preprocessing_num_workers: 4
dataloader_num_workers: 4

output_dir: /wanqing-develop/luowenjing/Param_Recommend/mfu_qwen3_14b/results/r2_mbs2_z2/save
logging_steps: 1
save_strategy: "no"
plot_loss: false
overwrite_output_dir: true
report_to: none
disable_tqdm: true

max_steps: 20
per_device_train_batch_size: 2   # GBS = 4卡 × 2 × 4 = 32
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
lr_scheduler_type: cosine
lr_scheduler_kwargs: {"num_cycles": 0.5}
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
seed: 42
optim: adamw_torch_fused
ddp_timeout: 180000000
deepspeed: /wanqing-models/tangcan/llama-factory-local/llama-factory/examples/deepspeed/ds_z2_config.json
include_num_input_tokens_seen: true
resume_from_checkpoint: null

do_eval: false
eval_strategy: "no"              # 必须显式写；只写 do_eval:false 关不掉 eval
