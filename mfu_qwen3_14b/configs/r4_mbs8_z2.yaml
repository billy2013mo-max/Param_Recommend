### ========================================================================
### R4 · 吞吐模型的第一名：MBS 8 + ZeRO-2
### ------------------------------------------------------------------------
### 模型预测峰值显存 132.3 GiB / 安全线 133.4 GiB —— 余量只有 1 GiB，
###   而且那个预测里没算"不开 CCE 多出来的 logits"（MBS8×4096 约 17 GiB）。
### 所以本组**预期会 OOM**。跑它是为了确认上界在哪，OOM 不算实验失败。
### GAS=1 意味着没有梯度累积，每步只有一次通信 —— 若真跑得下会最快。
###
### 本轮前提：不开 CCE、不开 LoRA Fusion（由启动脚本 unset 环境变量实现，
###   不是 yaml 参数；写进 yaml 会让参数解析直接报错）。
### GBS 固定 32（4卡 × MBS × GAS），与其余各组严格一致。
### ========================================================================

model_name_or_path: /wanqing-models/Qwen3-14B
trust_remote_code: true
flash_attn: fa3                  # ★ 显式指定 FA3；不写会落到 AUTO→FA2
enable_thinking: true
use_unsloth_gc: false           # 激活值不卸载 CPU

stage: sft
do_train: true
finetuning_type: full
enable_liger_kernel: false
disable_gradient_checkpointing: false   # 开梯度检查点

dataset: baseline_2gpu
dataset_dir: /wanqing-develop/chengjin
template: qwen3
cutoff_len: 4096                 # ★ 8192 → 4096（用户下限）
max_samples: 100000
packing: false
preprocessing_num_workers: 4
dataloader_num_workers: 4

output_dir: /wanqing-develop/luowenjing/Param_Recommend/mfu_qwen3_14b/results/r4_mbs8_z2/save
logging_steps: 1
save_strategy: "no"
plot_loss: false
overwrite_output_dir: true
report_to: none
disable_tqdm: true

max_steps: 20
per_device_train_batch_size: 8   # GBS = 4卡 × 8 × 1 = 32
gradient_accumulation_steps: 1
learning_rate: 1.0e-6
lr_scheduler_type: cosine
lr_scheduler_kwargs: {"num_cycles": 0.5}
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
seed: 42
optim: adamw_torch_fused
ddp_timeout: 180000000
deepspeed: /wanqing-models/tangcan/llama-factory-local/llama-factory/examples/deepspeed/ds_z2_config.json
include_num_input_tokens_seen: true
resume_from_checkpoint: null

do_eval: false
eval_strategy: "no"              # 必须显式写；只写 do_eval:false 关不掉 eval
