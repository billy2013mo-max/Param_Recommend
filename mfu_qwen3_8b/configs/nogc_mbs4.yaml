# 「不开梯度检查点」探测组。dropout=0.1。
# 为什么是 MBS=4 而不是 32：文档 5.4 实测 MBS=8 全关 GC 已 138.01 GiB 爆卡。
#   激活值随 MBS 线性涨 → MBS=4 约 77 GiB（可行），MBS=8 约 138 GiB（爆），MBS=32 约 500 GiB（无望）。
# GBS = 1 x 4 x 8 = 32（不变）
# 权衡：省掉重算的 forward，但 MBS 小 → kernel 效率降。净效果就是要测的东西。
# 若 OOM 属预期结果，不算实验失败。
model_name_or_path: /wanqing-models/Qwen3-8B
trust_remote_code: true
flash_attn: fa3
enable_thinking: true
use_unsloth_gc: false            # 不用 CPU offload（这是上一轮 4.6 点的主要来源）

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.1
lora_target: all
enable_liger_kernel: true
enable_cce: true
enable_fused_lora: true
cce_impl: cce
disable_gradient_checkpointing: true

dataset: baseline_1gpu
dataset_dir: /wanqing-develop/chengjin
template: qwen3
cutoff_len: 4096
max_samples: 100000
packing: true
preprocessing_num_workers: 8
dataloader_num_workers: 8

output_dir: /wanqing-develop/luowenjing/Param_Recommend/mfu_qwen3_8b/results/nogc_mbs4/save
logging_steps: 1
save_strategy: "no"              # 干净 per-step 窗口：20 步内不存盘
plot_loss: false
overwrite_output_dir: true
report_to: none
disable_tqdm: false

max_steps: 20
per_device_train_batch_size: 4
gradient_accumulation_steps: 8   # GBS = 1 x 4 x 8 = 32
learning_rate: 1.0e-6
lr_scheduler_type: constant_with_warmup
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
seed: 42
optim: adamw_torch_fused
ddp_timeout: 180000000
deepspeed: /wanqing-develop/chengjin/1卡任务逐步性能优化/configs/ds_z0_config.json
include_num_input_tokens_seen: true
resume_from_checkpoint: null

do_eval: false
eval_strategy: "no"              # 真关 eval（do_eval:false 不够，见文档踩坑）
