# Predictor rank 2, constrained to physical GPUs 4,5,6,7.
# GBS = 4 GPUs * 8 MBS * 4 GA = 128.

model_name_or_path: /wanqing-models/Qwen3-14B
trust_remote_code: true
enable_thinking: true
use_unsloth_gc: true
flash_attn: fa3

stage: sft
do_train: true
finetuning_type: full
enable_liger_kernel: true
enable_cce: true
cce_impl: cce
disable_gradient_checkpointing: false

dataset: baseline_2gpu
dataset_dir: /wanqing-develop/chengjin
template: qwen3
cutoff_len: 2048
max_samples: 100000
packing: true
neat_packing: false
preprocessing_num_workers: 4
dataloader_num_workers: 4

output_dir: /wanqing-develop/luowenjing/Param_Recommend/qwen3_14b_4gpu_rank_validation_20260730/outputs/rank2_z2_gc_mbs8_ga4
logging_steps: 1
logging_nan_inf_filter: false
save_strategy: "no"
plot_loss: false
overwrite_output_dir: true
report_to: none
disable_tqdm: false

max_steps: 45
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
lr_scheduler_type: cosine
lr_scheduler_kwargs: {"num_cycles": 0.5}
warmup_ratio: 0.03
weight_decay: 0.01
bf16: true
seed: 42
optim: adamw_torch
ddp_timeout: 180000000
deepspeed: /wanqing-develop/luowenjing/Param_Recommend/offline_experiments/config/deepspeed/ds_z2.json
include_num_input_tokens_seen: true
resume_from_checkpoint: null

do_eval: false
enable_torch_profiler: false
